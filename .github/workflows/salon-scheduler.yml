name: Advance the daily AI salon

on:
  schedule:
    # One coherent salon starts at 08:30 China time; later runs recover interrupted turns or article generation.
    - cron: "30 0 * * *"
    - cron: "17 4,10,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ai-salon
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Advance the current salon stage
        env:
          SALON_URL: https://economics-salon-yfcui.jijicyf.chatgpt.site
        run: node scripts/advance-public-salon.mjs
